[package]
name = "shellquarry"
version = "0.4.0"
description = "The browser shell for Herdr: a terminal and a browser side panel your agents drive over MCP."
authors = ["Obiwayne"]
license = "MIT"
repository = "https://github.com/Obiwayne/ShellQuarry"
edition = "2021"

[lib]
name = "shellquarry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables several webviews in one window (the browser tabs);
# "webview-data-url" lets a new tab start on a built-in blank page.
tauri = { version = "2", features = ["unstable", "webview-data-url"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
getrandom = "0.3"
toml = "0.9"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
