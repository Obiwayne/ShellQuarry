[package]
name = "shellquarry"
version = "0.1.0"
description = "A desktop shell for terminal agent tools with a built-in browser panel that agents can drive over MCP."
authors = ["Obiwayne"]
license = "MIT"
edition = "2021"

[lib]
name = "shellquarry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables several webviews in one window (the browser panel);
# "webview-data-url" lets the panel start on a built-in blank page.
tauri = { version = "2", features = ["unstable", "webview-data-url"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
