<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShellQuarry</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <span class="name">ShellQuarry</span>
      <span class="tag">prototype</span>
    </div>
    <div class="actions">
      <span class="chip" id="agent-chip" title="Agents connect with: node mcp/server.mjs">
        <span class="dot" id="agent-dot"></span><span id="agent-label">Agent browser ready</span>
      </span>
      <button class="icon-btn" id="globe" type="button" aria-pressed="false" aria-label="Toggle browser panel" title="Browser panel (Ctrl+Shift+B)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" /><path d="M3 12h18" /><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18" />
        </svg>
      </button>
    </div>
  </header>

  <main class="split" id="split">
    <section class="pane term-pane" id="term-pane" aria-label="Terminal">
      <div id="term"></div>
    </section>
    <div class="divider" id="divider" role="separator" aria-orientation="vertical" hidden></div>
    <section class="pane browser-pane" id="browser-pane" aria-label="Browser panel" hidden>
      <div class="browser-bar">
        <button class="icon-btn small" data-history="back" type="button" aria-label="Back">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6" /></svg>
        </button>
        <button class="icon-btn small" data-history="forward" type="button" aria-label="Forward">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6l-6 6" /></svg>
        </button>
        <button class="icon-btn small" data-history="reload" type="button" aria-label="Reload">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 4v7h-7" /></svg>
        </button>
        <form class="address" id="address">
          <span class="spinner" id="spinner" hidden></span>
          <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Type an address, or let your agent drive" />
        </form>
        <button class="icon-btn small" id="close-panel" type="button" aria-label="Close browser panel">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <!-- The native browser webview is placed exactly over this slot. -->
      <div class="browser-slot" id="browser-slot"></div>
    </section>
  </main>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
